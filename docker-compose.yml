services:
  caddy:
    image: caddy:2
    container_name: tg-relay
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/tg-relay/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: